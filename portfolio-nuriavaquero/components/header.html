<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Responsive</title>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
</head>

<body>

  <header>
    <a href="index.html"><img src="img/logo.svg" alt="Logo" class="logo"></a>

    <button id="abrir" class="abrir-menu"><i class="bi bi-list"></i></button>
    <nav class="nav" id="nav">
      <button class="cerrar-menu" id="cerrar"><i class="bi bi-x"></i></button>
      <ul class="nav-list">
        <li><a href="aboutMe.html" class="nav-link">About Me</a></li>
        <li><a href="projects.html" class="nav-link">Projects</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
    </nav>
  </header>

  <style>
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2rem;
      background: rgba(244, 243, 237, .9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #eee;
      font-family: "Urbanist", sans-serif;
      position: relative;
      z-index: 10;
         position: fixed;
      width: 100%;
    }

    .logo {
      max-width: 5rem;
    }

      .nav-link {
    font-weight: 500;
    transition: .2s
  }

  .nav-link:hover {
    color: #000;
    transform: scale(1.05)
  }

    .nav-list {
      display: flex;
      list-style-type: none;
      gap: 1rem;
      margin: 0;
      padding: 0;
    }

    .nav-list li a {
      text-decoration: none;
      color: #E63A27;
    }

    .abrir-menu,
    .cerrar-menu {
      display: none;
    }

    /* --- Versión móvil --- */
    @media screen and (max-width: 550px) {

      .abrir-menu,
      .cerrar-menu {
        display: block;
        border: 0;
        font-size: 1.5rem;
        background-color: transparent;
        cursor: pointer;
      }

      .abrir-menu {
        color: #1c1c1c;
      }

      .cerrar-menu {
        color: #ececec;
      }

      .nav {
  position: fixed;
  top: 0;
  right: 0;        /* anclado a la derecha */
  width: 50vw;    /* ocupa toda la pantalla */
  height: 100vh;
  z-index: 20999;

  display: flex;
  flex-direction: column;
  align-items: end;
  gap: 1.5rem;
  background-color: #E63A27;
  padding: 2rem;
  box-shadow: 0 0 0 100vmax rgba(0,0,0,.5);

  /* 🔑 Estado oculto: fuera de la pantalla a la derecha */
  transform: translateX(100%);
  transition: transform .3s ease-in-out;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;
       /* transition: opacity .25s ease, visibility .25s ease;*/
      }

      

      .nav.visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
         transform: translateX(0);
      }

      .nav-list {
        flex-direction: column;
        align-items: end;
      }

      .nav-list li a {
        text-decoration: none;
        color: white;
      }
    }
  </style>

</body>
</html>
